[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "order-streamlit-app"
version = "0.1.0"
requires-python = ">=3.10, <3.13"
dependencies = [
    "streamlit>=1.30.0,<1.40.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "requests>=2.28.0",
    "pillow>=10.4.0",
]
